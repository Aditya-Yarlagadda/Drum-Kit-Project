<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Drum Kit</title>
		<link rel="icon" href="./Assets/images/drumkiticon.png" />
		<link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet" />
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<h1 id="title">Drum 🥁 Kit</h1>
		<h2 id="description">Click the buttons or press the keys for a drum effect!</h2>
		<div class="set">
			<button class="w drum">
				<img src="./Assets/images/tom1.png" alt="Photo of a drum tilted to the right" />
				<p>w</p>
			</button>
			<button class="a drum">
				<img src="./Assets/images/tom2.png" alt="Photo of a drum tilted to the left" />
				<p>a</p>
			</button>
			<button class="s drum">
				<img src="./Assets/images/tom3.png" alt="Photo of a longer drum" />
				<p>s</p>
			</button>
			<button class="d drum">
				<img src="./Assets/images/tom4.png" alt="Photo of a longer drum with different stands" />
				<p>d</p>
			</button>
			<button class="j drum">
				<img src="./Assets/images/snare.png" alt="Photo of snare in a drum set" />
				<p>j</p>
			</button>
			<button class="k drum">
				<img src="./Assets/images/crash.png" alt="Photo of a crash in a drum set" />
				<p>k</p>
			</button>
			<button class="l drum">
				<img src="./Assets/images/kick.png" alt="Photo of a kick in a drum set" />
				<p>l</p>
			</button>
		</div>
		<script src="./index.js"></script>
	</body>
</html>
